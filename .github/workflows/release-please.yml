name: release-please
on:
  push:
    branches:
      - master

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.LINZ_GITHUB_AUTOMATION }}

  publish-schema:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Version schema
        run: npm run version-schema

      - name: Publish JSON schema to gh-pages for ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin gh-pages

          # Keep a copy of the versioned extensions and build the homepage before switching branches.
          # Each extension is published to /v<its version.txt>/<name>/, and the homepage (the repo README)
          # links each extension to its latest published version
          cp -r extensions "${RUNNER_TEMP}/extensions"
          SED_ARGS=(-E)
          for dir in extensions/*/; do
            name="$(basename "${dir}")"
            [ -f "${dir}version.txt" ] || continue
            SED_ARGS+=(-e "s#\(\./extensions/${name}/?\)#(/v$(cat "${dir}version.txt")/${name}/)#g")
          done
          SED_ARGS+=(-e "s#\(CHANGELOG\.md\)#(https://github.com/linz/stac/blob/master/CHANGELOG.md)#g")
          sed "${SED_ARGS[@]}" README.md > "${RUNNER_TEMP}/README.md"
          git checkout -- extensions

          git checkout gh-pages

          # Publish each extension's new version, never overwriting an already published one
          for dir in "${RUNNER_TEMP}"/extensions/*/; do
            name="$(basename "${dir}")"
            [ -f "${dir}version.txt" ] || continue
            target="v$(cat "${dir}version.txt")/${name}"
            if [ -e "${target}" ]; then
              echo "${target} is already published"
              continue
            fi
            mkdir -p "$(dirname "${target}")"
            cp -r "${dir}" "${target}"

            git add "${target}"
          done

          # Only update the homepage if this is the latest repository release
          # (e.g. not when an older failed release is re-run after a newer one)
          LATEST="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ "${LATEST}" = "${TAG_NAME}" ]; then
            cp "${RUNNER_TEMP}/README.md" README.md
            git add README.md
          else
            echo "${TAG_NAME} is older than ${LATEST}, so not updating the homepage"
          fi

          if git diff --cached --quiet; then
            echo "Nothing new to publish for ${TAG_NAME}"
            exit 0
          fi

          git commit -m "chore(schema): publish extensions and homepage for ${TAG_NAME}"
          git push origin gh-pages
