name: Publish STAC JSON schema
on:
  push:
    tags:
      - v*

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create github release
        run: npx conventional-github-releaser -p angular
        env:
          CONVENTIONAL_GITHUB_RELEASER_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Version schema
        run: yarn run version-schema

      - name: Deploy JSON Schema for version ${{ env.GITHUB_REF }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          TAG_NAME="${GITHUB_REF##*/}"

          git fetch origin gh-pages
          git checkout gh-pages

          mkdir -p ${TAG_NAME}
          cp -r ../extensions/* ${TAG_NAME}/

          git add ${TAG_NAME}
          git commit -m "chore(schema): publish schema for ${TAG_NAME}" || echo "Nothing to commit"
          git push origin gh-pages
